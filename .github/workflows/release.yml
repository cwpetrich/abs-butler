name: Release

# Tag-driven, so a release is a deliberate act rather than a side effect of a
# merge. `git tag v0.4.0 && git push --tags` publishes everything below.
#
# Deliberately tag-only, with no workflow_dispatch: off a branch there is no
# version to derive, so the tag list would come out empty and the push would
# fail at the last step. A publish that failed halfway is re-run with "Re-run
# jobs" on the original run, which keeps the tag it was triggered from.
on:
  push:
    tags: ['v*']

jobs:
  # The tag names the version and nothing checked that claim, which made one
  # silent mistake possible and self-perpetuating: tag v0.5.2 while the tree
  # still says 0.5.1 and everything succeeds. The image is labelled 0.5.2, the
  # program reports itself as 0.5.1, and every install is told an update is
  # available forever, because the version it compares never catches up.
  #
  # Both files are checked, not just package.json, since the number the running
  # program reports is the one in src/version.ts. version.test.ts already keeps
  # them equal, but it runs against a branch; this runs against the tag, which
  # is the thing being published.
  version:
    name: Tag matches the version in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - env:
          TAG: ${{ github.ref_name }}
        run: |
          declared=$(node -p "require('./package.json').version")
          compiled=$(node -p "require('node:fs').readFileSync('src/version.ts','utf8').match(/VERSION = '([^']+)'/)[1]")

          if [ "$TAG" != "v$declared" ]; then
            echo "::error::Tag $TAG does not match package.json version $declared."
            exit 1
          fi
          if [ "$declared" != "$compiled" ]; then
            echo "::error::package.json says $declared but src/version.ts says $compiled."
            exit 1
          fi
          echo "$TAG matches package.json and src/version.ts."

  docker:
    name: Publish multi-arch image
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.4.1 publishes 0.4.1, 0.4, and latest — so a compose file can
          # pin as loosely or as tightly as its owner wants.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag alone gives nothing to read. abs-butler tells an operator that a new
  # version exists and links here for what is in it, so the page has to exist
  # before the notice can point at it.
  #
  # Gated on the image, because the three jobs here used to run in parallel and
  # the failure that produced was quiet and bad: a failed build still published
  # a release page announcing a version, and the in-app update notice sends
  # people straight to it. An operator would read "0.5.1 is available", follow
  # the link, and find nothing to pull. Better to publish nothing than to
  # announce a version that does not exist.
  #
  # The snap is deliberately not a gate. It is published to a separate store on
  # its own schedule, and one architecture failing there should not withhold an
  # image that built correctly.
  release:
    name: Publish the GitHub release
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: re-running a release that failed later on must not fail
          # here because the release it already created is in the way.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  snap:
    name: Build and publish the snap
    needs: [version]
    runs-on: ${{ matrix.runner }}
    # Declared at job level so the publish step's `if` can read it: a step's own
    # env block is not in scope when its condition is evaluated.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      # One architecture failing should not withdraw the other from the store.
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Each architecture builds on its own hardware, so there is no
      # cross-build to arrange. This replaces `--build-for=arm64` on an amd64
      # runner, which snapcraft 9 refuses outright: "Cannot generate a project
      # that builds on amd64 and builds for arm64". Free arm64 runners are a
      # public-repository benefit, so this only became available when the
      # repository was opened up.
      - id: build
        uses: snapcore/action-build@v1

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}

      # Skipped rather than failed when the store credential is absent, so a
      # fork can run the whole workflow without one.
      - if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
