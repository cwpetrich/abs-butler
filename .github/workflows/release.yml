name: Release

# Tag-driven, so a release is a deliberate act rather than a side effect of a
# merge. `git tag v0.4.0 && git push --tags` publishes everything below.
#
# Deliberately tag-only, with no workflow_dispatch: off a branch there is no
# version to derive, so the tag list would come out empty and the push would
# fail at the last step. A publish that failed halfway is re-run with "Re-run
# jobs" on the original run, which keeps the tag it was triggered from.
on:
  push:
    tags: ['v*']

jobs:
  docker:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.4.1 publishes 0.4.1, 0.4, and latest — so a compose file can
          # pin as loosely or as tightly as its owner wants.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snap:
    name: Build and publish the snap
    runs-on: ubuntu-latest
    # Declared at job level so the publish step's `if` can read it: a step's own
    # env block is not in scope when its condition is evaluated.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      # One architecture failing should not withdraw the other from the store.
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - id: build
        uses: snapcore/action-build@v1
        with:
          # Cross-building under emulation; slower than a native runner, and it
          # keeps both architectures on one workflow.
          snapcraft-args: --build-for=${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}

      # Skipped rather than failed when the store credential is absent, so a
      # fork can run the whole workflow without one.
      - if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
