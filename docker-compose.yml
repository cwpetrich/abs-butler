# abs-butler is a CLI, not a server, so there are two ways to run it:
#
#   One-shot:    docker compose run --rm butler audit --details
#   Scheduled:   docker compose up -d scheduled-audit
#
# Settings come from .env (see .env.example). Two of them are compose-level
# rather than app-level, and are documented in docs/docker.md:
#
#   HOST_LIBRARY_PATH  where your audiobooks live on THIS machine
#   PUID / PGID        the user that owns them, so `organize` writes as you

x-butler: &butler
  build:
    context: .
  image: abs-butler:latest
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the container the library is always at /library, whatever the host
    # path is. This deliberately overrides any LIBRARY_ROOT set in .env, which
    # describes the host and would be meaningless in here.
    LIBRARY_ROOT: /library
  volumes:
    # Read-only by default, so nothing can touch your files by accident.
    # `organize --apply` needs LIBRARY_MOUNT_MODE=rw — see docs/docker.md.
    - ${HOST_LIBRARY_PATH:-./library}:/library:${LIBRARY_MOUNT_MODE:-ro}
  extra_hosts:
    # Lets ABS_URL=http://host.docker.internal:13378 reach an AudiobookShelf
    # running directly on this host rather than in the compose network.
    - "host.docker.internal:host-gateway"
  # Files created by `organize` inherit this ownership. Default matches the
  # image's built-in `node` user.
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: "no"

services:
  # One-shot CLI. Everything after the service name is passed to abs-butler:
  #   docker compose run --rm butler libraries
  #   docker compose run --rm butler audit --details
  #   docker compose run --rm butler rate --max-age 12
  butler:
    <<: *butler
    profiles: ["cli"]
    command: ["--help"]

  # Long-running: re-audits on an interval and logs the result.
  # Read-only and non-mutating by design — see docs/docker.md before adding --apply.
  scheduled-audit:
    <<: *butler
    container_name: abs-butler-scheduled-audit
    environment:
      LIBRARY_ROOT: /library
      BUTLER_SCHEDULE: ${BUTLER_SCHEDULE:-12h}
    command: ["audit", "--details"]
    restart: unless-stopped

  # Writes age/content tags back to AudiobookShelf on a schedule.
  # Not started by default: `docker compose --profile tagging up -d`.
  scheduled-rate:
    <<: *butler
    container_name: abs-butler-scheduled-rate
    profiles: ["tagging"]
    environment:
      LIBRARY_ROOT: /library
      BUTLER_SCHEDULE: ${BUTLER_SCHEDULE:-24h}
    command: ["rate", "--apply"]
    restart: unless-stopped
