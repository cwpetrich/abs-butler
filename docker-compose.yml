# abs-butler runs as a web service, with the same CLI available for one-off work:
#
#   docker compose up -d butler                  # web UI on :13380
#   docker compose run --rm cli status           # one-shot CLI
#
# There is nothing you must configure before the first launch. Start it, open
# http://localhost:13380, and set a password — abs-butler generates its own
# encryption key and stores everything else in its database.
#
# The one setting worth knowing about is HOST_LIBRARY_PATH: point it at the
# same directory AudiobookShelf uses, and `organize` becomes available.
#
# This pulls a published image, so the only file you need is this one — no
# clone, no build, and it works the same on amd64 and arm64. To run your own
# working tree instead, add the build override:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build butler

x-butler: &butler
  image: ${BUTLER_IMAGE:-ghcr.io/cwpetrich/abs-butler:latest}
  env_file:
    - path: .env
      required: false
  environment:
    # The database and encryption key always live at /data inside the
    # container; persist them with the butler-data volume below.
    BUTLER_DATA_DIR: /data
  volumes:
    - butler-data:/data
    # Mounted read-write, but abs-butler will not move a file until "Allow file
    # changes" is turned on in Settings — a switch you can flip without
    # recreating the container, unlike this mount flag.
    #
    # Enter /audiobooks as the library root in the UI: that is where this
    # container sees the media, whatever the host path is.
    - ${HOST_LIBRARY_PATH:-./audiobooks}:/audiobooks:rw
  # Files created by `organize` inherit this ownership. Default matches the
  # image's built-in `node` user.
  user: "${PUID:-1000}:${PGID:-1000}"
  extra_hosts:
    # Lets you use http://host.docker.internal:13378 as the server URL when
    # AudiobookShelf runs directly on this host rather than in a container.
    - "host.docker.internal:host-gateway"

services:
  # The web UI and job scheduler. This is the main way to run abs-butler.
  butler:
    <<: *butler
    container_name: abs-butler
    ports:
      # Both sides are BUTLER_PORT deliberately. The app inside reads the same
      # variable, so mapping host:13380 would forward to a port nothing listens
      # on the moment anyone changes it.
      #
      # Bound to loopback by default: until a password is set the setup page is
      # reachable by anyone who can see the port, so publishing it to the
      # network is opt-in via BUTLER_BIND=0.0.0.0.
      - "${BUTLER_BIND:-127.0.0.1}:${BUTLER_PORT:-13380}:${BUTLER_PORT:-13380}"
    restart: unless-stopped

  # One-shot CLI against the same database. Everything after the service name
  # is passed straight to abs-butler:
  #   docker compose run --rm cli connect --url ... --api-key ...
  #   docker compose run --rm cli audit --details
  cli:
    <<: *butler
    profiles: ["cli"]
    restart: "no"
    command: ["--help"]

volumes:
  butler-data:
